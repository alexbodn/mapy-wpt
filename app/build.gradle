plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.mapywptsaver'
    compileSdk 34

    defaultConfig {
        applicationId "com.mapywptsaver"
        minSdk 24
        targetSdk 34

        def ciVersion = System.getenv("GITHUB_RUN_NUMBER") as Integer
        versionCode ciVersion ?: 1
        versionName "1.0.${ciVersion ?: 0}"
    }

    signingConfigs {
        release {
            def tmpStoreFile = System.getenv("KEYSTORE_FILE")
            if (tmpStoreFile != null) {
                storeFile file(tmpStoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}
